services:
  santa-router:
    build: .
    container_name: santa-router
    ports:
      - "1025:1025"
      - "8080:8080"
    volumes:
      # Writable so the web dashboard can save changes to it.
      - ./config.json:/app/config.json
      # Keep credentials out of config.json and the image; create this file first.
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
    environment:
      CONFIG_PATH: /app/config.json
      SECRETS_PATH: /app/.env
    restart: unless-stopped
