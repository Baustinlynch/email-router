<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secret Santa Router{% endblock %}</title>
  <style>
    :root {
      --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
      --accent: #4f46e5; --danger: #dc2626; --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
    .wrap.narrow { max-width: 430px; }
    .bar { display: flex; justify-content: space-between; align-items: center;
           margin-bottom: 18px; }
    h1 { font-size: 1.3rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 4px; }
    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
    .hint { color: var(--muted); font-size: .85rem; margin: 2px 0 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border);
             font-size: .92rem; }
    th { color: var(--muted); font-size: .75rem; text-transform: uppercase;
         letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    input[type=text], input[type=password], input[type=number] {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
      font-size: .92rem; width: 100%; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { padding: 8px 14px; border: none; border-radius: 6px;
             background: var(--accent); color: #fff; font-size: .9rem;
             cursor: pointer; white-space: nowrap; }
    button:hover { filter: brightness(1.08); }
    button.danger { background: var(--danger); }
    button.ghost { background: transparent; color: var(--accent);
                   border: 1px solid var(--border); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row input { width: auto; flex: 1; min-width: 180px; }
    .stack { display: grid; gap: 10px; }
    .stack label, .login label { display: block; font-size: .82rem; color: var(--muted); }
    .stack input { margin-top: 4px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: .9rem;
             color: var(--text); }
    .check input { width: auto; }
    .grid { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(220px, 1.6fr) auto;
            gap: 8px 10px; align-items: center; }
    .grid.one { grid-template-columns: minmax(220px, 1fr) auto; }
    .grid .head { color: var(--muted); font-size: .75rem; text-transform: uppercase;
                  letter-spacing: .04em; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px;
             font-size: .9rem; }
    .flash.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .flash.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .88em; }
    .login h1 { text-align: center; margin-bottom: 8px; }
    .login button { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
